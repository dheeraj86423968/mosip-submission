\* Second TLC configuration: SUPERVISOR-shaped policy (minChallenges 2, maxChallenges 3,
\* maxRetries 2) with a longer passive window.  Larger state space; still finishes in seconds.
\* Run: java -cp tla2tools.jar tlc2.TLC -config LivenessOrchestrator-supervisor.cfg LivenessOrchestrator.tla

SPECIFICATION Spec

CONSTANTS
    MaxRetries       = 2
    MinChallenges    = 2
    MaxChallenges    = 3
    ScoreMax         = 4
    Threshold        = 4
    PassiveMinFrames = 3
    MinLatencyTicks  = 1
    TimeoutTicks     = 3

INVARIANTS
    TypeOK
    PassedImpliesPolicy
    AttemptsBounded
    FailedHasReason
    LockedHasReason
    ActiveNeedsPolicy
    ChallengeSequenceBounded
    AttemptStartedBeforeWork

PROPERTIES
    NoPassAfterVeto
    TerminalIsFinal
    EventuallyTerminal
