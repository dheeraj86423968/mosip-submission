\* TLC configuration for LivenessOrchestrator.tla
\* Small constants keep the state space finite and the check under a few seconds.
\* They mirror the OPERATOR policy shape (ALWAYS mode) but activeMode itself is
\* chosen nondeterministically in Init, so NEVER / ON_LOW_CONFIDENCE / ALWAYS are
\* all explored in one run.

SPECIFICATION Spec

CONSTANTS
    MaxRetries       = 2
    MinChallenges    = 1
    MaxChallenges    = 2
    ScoreMax         = 4
    Threshold        = 3
    PassiveMinFrames = 2
    MinLatencyTicks  = 1
    TimeoutTicks     = 3

INVARIANTS
    TypeOK
    PassedImpliesPolicy
    AttemptsBounded
    FailedHasReason
    LockedHasReason
    ActiveNeedsPolicy
    ChallengeSequenceBounded
    AttemptStartedBeforeWork

PROPERTIES
    NoPassAfterVeto
    TerminalIsFinal
    EventuallyTerminal
