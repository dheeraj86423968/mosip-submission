<title id="title">Desktop maximum retries reached: supervisor escalation</title>
<desc id="desc">State S8 for a resident. Preview off with lock icon. Copy: Face capture could not be completed. A supervisor is required to continue. Buttons: Request supervisor, Close.</desc>
