(#p6)"></g><g fill="none" stroke="#C9D6EA" stroke-width="8.1" stroke-linecap="round"><path d="M306.8,381.5 v-13.5 a25.200000000000003,25.200000000000003 0 0 1 50.400000000000006,0 v13.5"/></g><rect x="296.0" y="381.5" width="72.0" height="49.50000000000001" rx="7.2" fill="#C9D6EA" /><circle cx="332" cy="401.3" r="6.300000000000001" fill="#fff"/><rect x="329.75" y="404.0" width="4.5" height="12.600000000000001" rx="0" fill="#fff" /><g fill="none" stroke="#0F2A57" stroke-width="5.4" stroke-linecap="round"><path d="M719.2,223.0 v-9.0 a16.8,16.8 0 0 1 33.6,0 v9.0"/></g><rect x="712.0" y="223.0" width="48.0" height="33.0" rx="4.8" fill="#0F2A57" /><circle cx="736" cy="236.2" r="4.2" fill="#fff"/><rect x="734.5" y="238.0" width="3.0" height="8.4" rx="0" fill="#fff" /><text x="788" y="222" font-family="sans-serif" font-size="28" font-weight="bold" fill="#16202E" text-anchor="start" >Face capture could not be</text><text x="788" y="258" font-family="sans-serif" font-size="28" font-weight="bold" fill="#16202E" text-anchor="start" >completed.</text><text x="788" y="300" font-family="sans-serif" font-size="20" font-weight="normal" fill="#16202E" text-anchor="start" >A supervisor is required to continue.</text><rect x="788" y="344" width="230" height="44" rx="6" fill="#1D5FB4" /><text x="903.0" y="372.0" font-family="sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" >Request supervisor</text><rect x="1034" y="344" width="120" height="44" rx="6" fill="#FFFFFF" stroke="#1D5FB4" stroke-width="1.5" /><text x="1094.0" y="372.0" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1D5FB4" text-anchor="middle" >Close</text><rect x="700" y="520" width="516" height="100" rx="8" fill="#F7F0FB" stroke="#8E44AD" stroke-width="1.5" stroke-dasharray="5 4"/><text x="714" y="542" font-family="sans-serif" font-size="13" font-weight="bold" fill="#8E44AD" text-anchor="start" >Design note</text><text x="714" y="562" font-family="sans-serif" font-size="13" font-weight="normal" fill="#5B2C6F" text-anchor="start" >Buttons follow onMaxRetries. Request supervisor: supervisor</text><text x="714" y="582" font-family="sans-serif" font-size="13" font-weight="normal" fill="#5B2C6F" text-anchor="start" >passes their own liveness check, then a new resident session</text><text x="714" y="602" font-family="sans-serif" font-size="13" font-weight="normal" fill="#5B2C6F" text-anchor="start" >starts as Assisted capture (accessibility pool). All audited.</text><rect x="0" y="720" width="1280" height="80" rx="0" fill="#FFFFFF" /><line x1="0" y1="720" x2="1280" y2="720" stroke="#D6DEE9"/><text x="1256" y="766" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1D5FB4" text-anchor="end" text-decoration="underline">Diagnostics</text><text x="640.0" y="766" font-family="sans-serif" font-size="13" font-weight="normal" fill="#8A98AB" text-anchor="middle" >Mockup · S8 Max retries (resident)</text>
