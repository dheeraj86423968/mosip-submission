<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" font-family="sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Face liveness user flow</title>
<desc id="desc">Start, device connecting (device error branch with Retry), positioning, passive check, decision on score and active mode, active challenges, success, liveness failure with guidance, generic PAD failure, retry while attempts remain, then max retries with supervisor escalation, password, biometric exception or close.</desc>
<rect x="0" y="0" width="1280" height="900" rx="0" fill="#F3F6FA" /><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6A80"/></marker></defs><text x="40" y="50" font-family="sans-serif" font-size="22" font-weight="bold" fill="#0F2A57" text-anchor="start" >Face liveness user flow: passive → active → decision → retry / escalate</text><text x="40" y="76" font-family="sans-serif" font-size="14" font-weight="normal" fill="#5A6A80" text-anchor="start" >Same SessionState on Desktop (JavaFX) and Android (Flutter). State ids as in docs/design/12-ux-spec.md §2.</text><rect x="40" y="120" width="170" height="70" rx="10" fill="#0F2A57" stroke="#0F2A57" stroke-width="2" /><rect x="50" y="108" width="30" height="22" rx="11" fill="#0F2A57" /><text x="65" y="124" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle" >S0</text><text x="125.0" y="143.0" font-family="sans-serif" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle" >Start capture</text><text x="125.0" y="165.0" font-family="sans-serif" font-size="13" font-weight="normal" fill="#fff" text-anchor="middle" >resident / operator /</text><text x="125.0" y="183.0" font-family="sans-serif" font-size="13" font-weight="normal" fill="#fff" text-anchor="middle" >supervisor</text><rect x="250" y="120" width="190" height="70" rx="10" fill="#FFFFFF" stroke="#1D5FB4" stroke-width="2" /><rect x="260" y="108" width="30" height="22" rx="11" fill="#1D5FB4" /><text x="275" y="124" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle" >S1</text><text x="345.0" y="143.0" font-family="sans-serif" font-size="16" font-weight="bold" fill="#16202E" text-anchor="middle" >Connecting</text><text x="345.0" y="165.0" font-family="sans-serif" font-size="13" font-weight="normal" fill="#5A6A80" text-anchor="middle" >“Connecting to the face</text><text x="345.0" y="183.0" font-family="sans-serif" font-size="13" font-weight="normal" fill="#5A6A80" text-anchor="middle" >capture device…”</text><rect x="480" y="120" width="200" height="70" rx="10" fill="#FFFFFF" stroke="#1D5FB4" stroke-width="2" /><rect x="490" y="108" width="30" height="22" rx="11" fill="#1D5FB4" /><text x="505" y="124" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle" >S2</text><text x="580.0" y="143.0" font-family="sans-serif" font-size="16" font-weight="bold" fill="#16202E" text-anchor="middle" >Positioning</text><text x="580.0" y="165.0" font-family="sans-serif" font-size="13" font-weight="normal" fill="#5A6A80" text-anchor="middle" >hints: Move closer,</text><text x="580.0" y="183.0" font-family="sans-serif" font-size="13" font-weight="normal" fill="#5A6A80" text-anchor="middle" >Centre your face …</text><rect x="720" y="120" width="220" height="70" rx="10" fill="#FFFFFF" stroke="#1D5FB4" stroke-width="2" /><rect x="730" y="108" width="30" height="22" rx="11" fill="#1D5FB4" /><text x="745" y="124" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle" >S3</text><text x="830.0" y="143.0" font-family="sans-serif" font-size="16" font-weight="bold" fill="#16202E" text-anchor="middle" >Passive check</text><text x="830.0" y="165.0" font-family="sans-serif" font-size="13" font-weight="normal" fill="#5A6A80" text-anchor="middle" >“Checking face liveness…”</text><text x="830.0" y="183.0" font-family="sans-serif" font-size="13" font-weight="normal" fill="#5A6A80" text-anchor="middle" >resident does nothing</text><path d="M210,155 L248,155" fill="none" stroke="#5A6A80" stroke-width="2" marker-end="url(#arr)"/><path d="M440,155 L478,155" fill="none" stroke="#5A6A80" stroke-width="2" marker-end="url(#arr)"/><path d="M680,155 L718,155" fill="none" stroke="#5A6A80" stroke-width="2" marker-end="url(#arr)"/><rect x="250" y="250" width="190" height="70" rx="10" fill="#FCEBEA" stroke="#C0392B" stroke-width="2" /><rect x="260" y="238" width="38" height="22" rx="11" fill="#C0392B" /><text x="279" y="254" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle" >S1e</text><text x="345.0" y="282.0" font-family="sans-serif" font-size="16" font-weight="bold" fill="#16202E" text-anchor="middle" >Device error</text><text x="345.0" y="304.0" font-family="sans-serif" font-size="13" font-weight="normal" fill="#5A6A80" text-anchor="middle" >Retry · Diagnostics</text><path d="M345,190 L345,248" fill="none" stroke="#5A6A80" stroke-width="2" marker-end="url(#arr)"/><rect x="295.8" y="212" width="98.4" height="20" rx="4" fill="#F3F6FA" /><text x="345" y="227" font-family="sans-serif" font-size="12" font-weight="bold" fill="#5A6A80" text-anchor="middle" >device fault</text><path d="M250,285 L125,285 L125,192" fill="none" stroke="#5A6A80" stroke-width="2" marker-end="url(#arr)"/><rect x="151.0" y="264" width="48.0" height="20" rx="4" fill="#F3F6FA" /><text x="175" y="279" font-family="sans-serif" font-size="12" font-weight="bold" fill="#5A6A80" text-anchor="middle" >Retry</text><polygon points="830,245.0 960.0,300 830,355.0 700.0,300" fill="#E7F0FB" stroke="#1D5FB4" stroke-width="2"/><text x="830" y="296" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0F2A57" text-anchor="middle" >score ≥ threshold and</text><text x="830" y="314" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0F2A57" text-anchor="middle" >mode ON_LOW_CONF.?</text><path d="M830,190 L830,243" fill="none" stroke="#5A6A80" stroke-width="2" marker-end="url(#arr)"/><rect x="1010" y="120" width="220" height="70" rx="10" fill="#EAF0F7" stroke="#4F6B8F" stroke-width="2" /><text x="1120.0" y="152.0" font-family="sans-serif" font-size="16" font-weight="bold" fill="#16202E" text-anchor="middle" >PAD veto / drift</text><text x="1120.0" y="174.0" font-family="sans-serif" font-size="13" font-weight="normal" fill="#5A6A80" text-anchor="middle" >hard veto at any frame</text><path d="M940,155 L1008,155" fill="none" stroke="#5A6A80" stroke-width="2" marker-end="url(#arr)"/><rect x="953.6" y="133" width="40.8" height="20" rx="4" fill="#F3F6FA" /><text x="974" y="148" font-family="sans-serif" font-size="12" font-weight="bold" fill="#5A6A80" text-anchor="middle" >veto</text><rect x="1010" y="265" width="220" height="70" rx="10" fill="#E5F5EC" stroke="#1E8A4C" stroke-width="2" /><rect x="1020" y="253" width="30" height="22" rx="11" fill="#1E8A4C" /><text x="1035" y="269" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle" >S5</text><text x="1120.0" y="288.0" font-family="sans-serif" font-size="16" font-weight="bold" fill="#16202E" text-anchor="middle" >Passed</text><text x="1120.0" y="310.0" font-family="sans-serif" font-size="13" font-weight="normal" fill="#5A6A80" text-anchor="middle" >“Good, face captured</text><text x="1120.0" y="328.0" font-family="sans-serif" font-size="13" font-weight="normal" fill="#5A6A80" text-anchor="middle" >successfully”</text><path d="M960,300 L1008,300" fill="none" stroke="#5A6A80" stroke-width="2" marker-end="url(#arr)"/><rect x="967.2" y="276" width="33.6" height="20" rx="4" fill="#F3F6FA" /><text x="984" y="291" font-family="sans-serif" font-size="12" font-weight="bold" fill="#5A6A80" text-anchor="middle" >yes</text><rect x="700" y="420" width="260" height="80" rx="10" fill="#FFFFFF" stroke="#1D5FB4" stroke-width="2" /><rect x="710" y="408" width="30" height="22" rx="11" fill="#1D5FB4" /><text x="725" y="424" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle" >S4</text><text x="830.0" y="448.0" font-family="sans-serif" font-size="16" font-weight="bold" fill="#16202E" text-anchor="middle" >Active challenges</text><text x="830.0" y="470.0" font-family="sans-serif" font-size="13" font-weight="normal" fill="#5A6A80" text-anchor="middle" >1–3 random prompts, e.g.</text><text x="830.0" y="488.0" font-family="sans-serif" font-size="13" font-weight="normal" fill="#5A6A80" text-anchor="middle" >“Please blink” · ●●○ · 6 s ring</text><path d="M830,355 L830,418" fill="none" stroke="#5A6A80" stroke-width="2" marker-end="url(#arr)"/><rect x="734.0" y="378" width="192.0" height="20" rx="4" fill="#F3F6FA" /><text x="830" y="393" font-family="sans-serif" font-size="12" font-weight="bold" fill="#5A6A80" text-anchor="middle" >no (low score, or ALWAYS)</text><polygon points="830,540.0 950.0,590 830,640.0 710.0,590" fill="#E7F0FB" stroke="#1D5FB4" stroke-width="2"/><text x="830" y="586" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0F2A57" text-anchor="middle" >all actions done</text><text x="830" y="604" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0F2A57" text-anchor="middle" >and score ok?</text><path d="M830,500 L830,538" fill="none" stroke="#5A6A80" stroke-width="2" marker-end="url(#arr)"/><path d="M950,590 L1120,590 L1120,337" fill="none" stroke="#5A6A80" stroke-width="2" marker-end="url(#arr)"/><rect x="1023.2" y="568" width="33.6" height="20" rx="4" fill="#F3F6FA" /><text x="1040" y="583" font-family="sans-serif" font-size="12" font-weight="bold" fill="#5A6A80" text-anchor="middle" >yes</text><rect x="420" y="545" width="220" height="90" rx="10" fill="#FCEBEA" stroke="#C0392B" stroke-width="2" /><rect x="430" y="533" width="30" height="22" rx="11" fill="#C0392B" /><text x="445" y="549" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle" >S6</text><text x="530.0" y="569.0" font-family="sans-serif" font-size="16" font-weight="bold" fill="#16202E" text-anchor="middle" >Liveness failed</text><text x="530.0" y="591.0" font-family="sans-serif" font-size="13" font-weight="normal" fill="#5A6A80" text-anchor="middle" >“We could not verify face</text><text x="530.0" y="609.0" font-family="sans-serif" font-size="13" font-weight="normal" fill="#5A6A80" text-anchor="middle" >liveness. Please try again.”</text><text x="530.0" y="627.0" font-family="sans-serif" font-size="13" font-weight="normal" fill="#5A6A80" text-anchor="middle" >+ up to 3 guidance lines</text><path d="M710,590 L642,590" fill="none" stroke="#5A6A80" stroke-width="2" marker-end="url(#arr)"/><rect x="662.8" y="568" width="26.4" height="20" rx="4" fill="#F3F6FA" /><text x="676" y="583" font-family="sans-serif" font-size="12" font-weight="bold" fill="#5A6A80" text-anchor="middle" >no</text><rect x="1010" y="690" width="220" height="80" rx="10" fill="#EAF0F7" stroke="#4F6B8F" stroke-width="2" /><rect x="1020" y="678" width="30" height="22" rx="11" fill="#4F6B8F" /><text x="1035" y="694" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle" >S7</text><text x="1120.0" y="718.0" font-family="sans-serif" font-size="16" font-weight="bold" fill="#16202E" text-anchor="middle" >PAD / generic failure</text><text x="1120.0" y="740.0" font-family="sans-serif" font-size="13" font-weight="normal" fill="#5A6A80" text-anchor="middle" >“Face verification could</text><text x="1120.0" y="758.0" font-family="sans-serif" font-size="13" font-weight="normal" fill="#5A6A80" text-anchor="middle" >not be completed.”</text><path d="M1150,190 L1150,230 L1250,230 L1250,730 L1232,730" fill="none" stroke="#5A6A80" stroke-width="2" marker-end="url(#arr)"/><path d="M830,640 L830,730 L1008,730" fill="none" stroke="#5A6A80" stroke-width="2" marker-end="url(#arr)"/><rect x="867.2" y="708" width="105.60000000000001" height="20" rx="4" fill="#F3F6FA" /><text x="920" y="723" font-family="sans-serif" font-size="12" font-weight="bold" fill="#5A6A80" text-anchor="middle" >PAD in active</text><polygon points="530,695.0 640.0,740 530,785.0 420.0,740" fill="#E7F0FB" stroke="#1D5FB4" stroke-width="2"/><text x="530" y="745" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0F2A57" text-anchor="middle" >attempt &lt; max?</text><path d="M530,637 L530,693" fill="none" stroke="#5A6A80" stroke-width="2" marker-end="url(#arr)"/><path d="M1010,750 L980,750 L980,800 L680,800 L680,740 L642,740" fill="none" stroke="#5A6A80" stroke-width="2" marker-end="url(#arr)"/><rect x="762.8" y="778" width="134.4" height="20" rx="4" fill="#F3F6FA" /><text x="830" y="793" font-family="sans-serif" font-size="12" font-weight="bold" fill="#5A6A80" text-anchor="middle" >retry rules apply</text><path d="M420,740 L300,740 L300,420 L580,420 L580,192" fill="none" stroke="#1D5FB4" stroke-width="2" marker-end="url(#arr)"/><rect x="315.2" y="398" width="249.6" height="20" rx="4" fill="#F3F6FA" /><text x="440" y="413" font-family="sans-serif" font-size="12" font-weight="bold" fill="#5A6A80" text-anchor="middle" >yes: Try again (attempt n of max)</text><rect x="40" y="690" width="230" height="90" rx="10" fill="#FFF4DD" stroke="#D98A00" stroke-width="2" /><rect x="50" y="678" width="30" height="22" rx="11" fill="#D98A00" /><text x="65" y="694" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle" >S8</text><text x="155.0" y="723.0" font-family="sans-serif" font-size="16" font-weight="bold" fill="#16202E" text-anchor="middle" >Max retries / locked</text><text x="155.0" y="745.0" font-family="sans-serif" font-size="13" font-weight="normal" fill="#5A6A80" text-anchor="middle" >resident: “A supervisor is</text><text x="155.0" y="763.0" font-family="sans-serif" font-size="13" font-weight="normal" fill="#5A6A80" text-anchor="middle" >required to continue.”</text><path d="M530,785 L530,830 L155,830 L155,782" fill="none" stroke="#5A6A80" stroke-width="2" marker-end="url(#arr)"/><rect x="326.8" y="808" width="26.4" height="20" rx="4" fill="#F3F6FA" /><text x="340" y="823" font-family="sans-serif" font-size="12" font-weight="bold" fill="#5A6A80" text-anchor="middle" >no</text><rect x="40" y="530" width="230" height="120" rx="10" fill="#FFFFFF" stroke="#1D5FB4" stroke-width="2" /><text x="155.0" y="560.0" font-family="sans-serif" font-size="16" font-weight="bold" fill="#16202E" text-anchor="middle" >onMaxRetries</text><text x="155.0" y="582.0" font-family="sans-serif" font-size="13" font-weight="normal" fill="#5A6A80" text-anchor="middle" >Request supervisor →</text><text x="155.0" y="600.0" font-family="sans-serif" font-size="13" font-weight="normal" fill="#5A6A80" text-anchor="middle" >assisted capture (S10)</text><text x="155.0" y="618.0" font-family="sans-serif" font-size="13" font-weight="normal" fill="#5A6A80" text-anchor="middle" >Use password · Biometric</text><text x="155.0" y="636.0" font-family="sans-serif" font-size="13" font-weight="normal" fill="#5A6A80" text-anchor="middle" >exception · Close</text><path d="M155,690 L155,652" fill="none" stroke="#5A6A80" stroke-width="2" marker-end="url(#arr)"/><path d="M40,590 L20,590 L20,155 L38,155" fill="none" stroke="#1D5FB4" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="44" y="400" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1D5FB4" text-anchor="middle" transform="rotate(-90 44 400)">supervisor-attested new session</text><text x="40" y="878" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0F2A57" text-anchor="start" >Legend:</text><rect x="110" y="865" width="22" height="16" rx="4" fill="#E5F5EC" stroke="#1E8A4C" stroke-width="2" /><text x="140" y="878" font-family="sans-serif" font-size="13" font-weight="normal" fill="#16202E" text-anchor="start" >success</text><rect x="230" y="865" width="22" height="16" rx="4" fill="#FCEBEA" stroke="#C0392B" stroke-width="2" /><text x="260" y="878" font-family="sans-serif" font-size="13" font-weight="normal" fill="#16202E" text-anchor="start" >actionable failure (guidance)</text><rect x="450" y="865" width="22" height="16" rx="4" fill="#EAF0F7" stroke="#4F6B8F" stroke-width="2" /><text x="480" y="878" font-family="sans-serif" font-size="13" font-weight="normal" fill="#16202E" text-anchor="start" >security failure (generic message)</text><rect x="710" y="865" width="22" height="16" rx="4" fill="#FFF4DD" stroke="#D98A00" stroke-width="2" /><text x="740" y="878" font-family="sans-serif" font-size="13" font-weight="normal" fill="#16202E" text-anchor="start" >locked / escalation</text><rect x="900" y="865" width="22" height="16" rx="4" fill="#FFFFFF" stroke="#1D5FB4" stroke-width="2" /><text x="930" y="878" font-family="sans-serif" font-size="13" font-weight="normal" fill="#16202E" text-anchor="start" >screen state</text>
</svg>
