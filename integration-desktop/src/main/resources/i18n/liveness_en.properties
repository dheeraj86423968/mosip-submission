# Face liveness / PAD prompts for the MOSIP Desktop Registration Client (English).
# Keys are produced by io.mosip.vivid.desktop.LivenessMessages. Never put a PAD-specific text under a key the UI shows.

# --- session phases ---
liveness.state.idle=Ready
liveness.state.device_connecting=Connecting to the camera…
liveness.state.face_acquiring=Position your face inside the oval
liveness.state.passive_evaluating=Checking face liveness…
liveness.state.active_challenge=Follow the instruction
liveness.state.passed=Good, face captured successfully
liveness.state.failed=We could not verify face liveness. Please try again.
liveness.state.locked=Face verification is locked
liveness.state.cancelled=Verification cancelled

# --- hints ---
liveness.hint.none=
liveness.hint.move_closer=Please move closer
liveness.hint.move_back=Please move back
liveness.hint.center_face=Please center your face in the oval
liveness.hint.look_at_camera=Please look at the camera
liveness.hint.improve_lighting=Please move to a brighter place
liveness.hint.hold_still=Hold still
liveness.hint.only_one_face=Only one face should be visible
liveness.hint.checking_liveness=Checking face liveness…
liveness.hint.please_continue=Please continue
liveness.hint.action_detected=Action detected
liveness.hint.captured_ok=Good, face captured successfully
liveness.hint.try_again=We could not verify face liveness. Please try again.
liveness.hint.retry_available=You can try again
liveness.hint.max_retries_reached=Maximum attempts reached
liveness.hint.device_reconnecting=Reconnecting to the camera…
liveness.hint.device_disconnected=Camera disconnected

# --- active challenges ---
liveness.challenge.blink=Please blink
liveness.challenge.blink_twice=Please blink twice
liveness.challenge.smile=Please smile
liveness.challenge.open_mouth=Please open your mouth
liveness.challenge.raise_eyebrows=Please raise your eyebrows
liveness.challenge.turn_left=Please turn your head to the left
liveness.challenge.turn_right=Please turn your head to the right
liveness.challenge.look_up=Please look up
liveness.challenge.look_down=Please look down
liveness.challenge.nod=Please nod your head
liveness.challenge.hold_still=Please hold still
liveness.challenge.speak_code=Please read this number aloud: {0}
liveness.challenge.progress=Step {0} of {1}

# --- failures (user-facing; PAD and identity drift always use the generic text) ---
liveness.failure.generic=Face verification could not be completed. Please try again.
liveness.failure.liveness=We could not verify face liveness. Please try again.
liveness.failure.device_unavailable=The face capture device is not available. Please check the device and try again.
liveness.failure.device_connection_failure=Could not connect to the face capture device. Please check the connection and try again.
liveness.failure.camera_unavailable=The camera is not available. Please check the device and try again.
liveness.failure.face_not_detected=No face was detected. Please look at the camera and try again.
liveness.failure.multiple_faces=More than one face was detected. Only the applicant should be in front of the camera.
liveness.failure.poor_face_quality=The image quality is too low. Please improve the lighting and try again.
liveness.failure.max_retries_exceeded=Maximum attempts reached. Please contact the supervisor.
liveness.failure.invalid_frame_data=The camera sent invalid data. Please reconnect the device and try again.
liveness.failure.engine_error=Face verification is temporarily unavailable. Please try again or contact support.
liveness.failure.session_timeout=Face verification timed out. Please try again.
liveness.failure.cancelled=Face verification was cancelled.
liveness.failure.policy_disabled=Face liveness verification is disabled by configuration.
liveness.failure.guidance=Make sure your whole face is visible, remove hats and sunglasses, face the camera in good light, and follow the on-screen instruction.

# --- retries / lock ---
liveness.retry.counter=Attempt {0} of {1}
liveness.locked.title=Face verification locked
liveness.locked.guidance=The maximum number of attempts has been reached. Ask a supervisor to continue, or mark a biometric exception as per centre procedure.
liveness.action.retry=Try again
liveness.action.cancel=Cancel

# --- device chip ---
liveness.device.connecting=Camera: connecting
liveness.device.connected=Camera: connected
liveness.device.degraded=Camera: degraded
liveness.device.reconnecting=Camera: reconnecting
liveness.device.disconnected=Camera: disconnected
liveness.device.failed=Camera: error

# --- misc ---
liveness.network.online=Online
liveness.network.offline=Offline
liveness.diagnostics.title=Liveness diagnostics
liveness.diagnostics.toggle=Diagnostics
